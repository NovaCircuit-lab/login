<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NovaCircuit Login</title>
</head>
<body>

<h2>NovaCircuit 登入</h2>
<button onclick="login()">使用 Google 登入</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBiaT27TRKaWCVQRkJ8VnwbnvvDRS9vINM",
    authDomain: "account-master-novacircuit.firebaseapp.com",
    projectId: "account-master-novacircuit",
    storageBucket: "account-master-novacircuit.firebasestorage.app",
    messagingSenderId: "539774822914",
    appId: "1:539774822914:web:531bee934e477fc319151b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  window.login = function () {
    signInWithPopup(auth, provider)
      .then((result) => {
        alert("登入成功：" + result.user.displayName);
      })
      .catch((error) => {
        console.error(error);
        alert("登入失敗");
      });
  };
</script>

</body>
</html>

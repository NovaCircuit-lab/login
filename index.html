<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入系統</title>
<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#1e293b;
  padding:30px;
  border-radius:12px;
  width:300px;
}
input{
  width:100%;
  margin:8px 0;
  padding:8px;
  border-radius:6px;
  border:none;
}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#22c55e;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
#status{
  margin-top:10px;
  font-size:14px;
}
</style>
</head>
<body>

<div class="box">
  <h2>登入</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">登入</button>
  <div id="status"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.2.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.2.0/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyBiaT27TRKaWCVQRkJ8VnwbnvvDRS9vINM",
  authDomain: "account-master-novacircuit.firebaseapp.com",
  projectId: "account-master-novacircuit",
  storageBucket: "account-master-novacircuit.firebasestorage.app",
  messagingSenderId: "539774822914",
  appId: "1:539774822914:web:531bee934e477fc319151b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const status = document.getElementById("status");

  try{
    status.innerText = "登入中...";

    const userCredential = await signInWithEmailAndPassword(auth, email, password);

    // 取得 Firebase ID Token
    const token = await userCredential.user.getIdToken();

    status.innerText = "登入成功，建立連線中...";

    // 建立 WebSocket 連線
    const ws = new WebSocket(`wss://account-master.onrender.com/?token=${token}`);

    ws.onopen = () => {
      status.innerText = "已連線到伺服器 ✅";
    };

    ws.onmessage = (msg) => {
      console.log("伺服器回覆:", msg.data);
    };

    ws.onerror = () => {
      status.innerText = "WebSocket 連線錯誤";
    };

  }catch(err){
    status.innerText = "登入失敗：" + err.message;
  }
}
</script>

</body>
</html>

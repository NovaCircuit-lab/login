<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳號系統</title>
<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#1e293b;
  padding:30px;
  border-radius:12px;
  width:320px;
}
h2{
  text-align:center;
}
input{
  width:100%;
  margin:8px 0;
  padding:8px;
  border-radius:6px;
  border:none;
}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#22c55e;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
.switch{
  margin-top:10px;
  text-align:center;
  font-size:14px;
  cursor:pointer;
  color:#38bdf8;
}
#status{
  margin-top:10px;
  font-size:14px;
  min-height:20px;
}
</style>
</head>
<body>

<div class="box">
  <h2 id="title">登入</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="submitAction()">登入</button>
  <div class="switch" onclick="toggleMode()">還沒有帳號？註冊</div>
  <div id="status"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.2.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/10.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiaT27TRKaWCVQRkJ8VnwbnvvDRS9vINM",
  authDomain: "account-master-novacircuit.firebaseapp.com",
  projectId: "account-master-novacircuit",
  storageBucket: "account-master-novacircuit.firebasestorage.app",
  messagingSenderId: "539774822914",
  appId: "1:539774822914:web:531bee934e477fc319151b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let isLoginMode = true;

window.toggleMode = function(){
  isLoginMode = !isLoginMode;
  document.getElementById("title").innerText = isLoginMode ? "登入" : "註冊";
  document.querySelector("button").innerText = isLoginMode ? "登入" : "註冊";
  document.querySelector(".switch").innerText = 
    isLoginMode ? "還沒有帳號？註冊" : "已有帳號？登入";
  document.getElementById("status").innerText = "";
}

window.submitAction = async function(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const status = document.getElementById("status");

  if(password.length < 6){
    status.innerText = "密碼至少 6 個字元";
    return;
  }

  try{
    status.innerText = isLoginMode ? "登入中..." : "註冊中...";

    let userCredential;

    if(isLoginMode){
      userCredential = await signInWithEmailAndPassword(auth, email, password);
    }else{
      userCredential = await createUserWithEmailAndPassword(auth, email, password);
    }

    const token = await userCredential.user.getIdToken();

    status.innerText = "成功，連線伺服器中...";

    const ws = new WebSocket(`wss://account-master.onrender.com/?token=${token}`);

    ws.onopen = () => {
      status.innerText = "已登入並連線成功 ✅";
    };

    ws.onmessage = (msg) => {
      console.log("伺服器回覆:", msg.data);
    };

    ws.onerror = () => {
      status.innerText = "WebSocket 連線錯誤";
    };

  }catch(err){
    status.innerText = "錯誤：" + err.message;
  }
}
</script>

</body>
</html>

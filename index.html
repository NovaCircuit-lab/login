<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Server 測試頁</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #cfcfcf; }
input, button { margin: 5px 0; }
#log { border: 1px solid #555; height: 300px; overflow-y: scroll; padding: 5px; margin-top: 10px; }
</style>
</head>
<body>

<h2>Master Server 測試頁</h2>

<div>
  <h3>Firebase 登入</h3>
  <input type="email" id="email" placeholder="Email"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <button onclick="login()">登入</button>
</div>

<div>
  <h3>WebSocket 指令</h3>
  <button onclick="connectWS()">連線 WebSocket</button><br>
  <button onclick="updateNickname()">更新暱稱</button><br>
  <button onclick="redeemInvite()">兌換邀請碼</button><br>
  <button onclick="earnCircuit()">發放 Circuit 幣</button>
</div>

<div id="log"></div>

<script>
// ====== Firebase 初始化 ======
const firebaseConfig = {
  apiKey: "你的Firebase apiKey",
  authDomain: "account-master-novacircuit.firebaseapp.com",
  projectId: "account-master-novacircuit"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let ws = null;
let idToken = "";

// ====== 日誌 ======
function log(msg) {
  const logDiv = document.getElementById("log");
  logDiv.innerHTML += msg + "<br>";
  logDiv.scrollTop = logDiv.scrollHeight;
}

// ====== 登入 ======
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    const userCredential = await auth.signInWithEmailAndPassword(email, password);
    idToken = await userCredential.user.getIdToken();
    log(`登入成功: ${userCredential.user.uid}`);
  } catch (err) {
    log("登入失敗: " + err.message);
  }
}

// ====== 連線 WebSocket ======
function connectWS() {
  if (!idToken) {
    log("請先登入 Firebase");
    return;
  }
  ws = new WebSocket(`wss://account-master.onrender.com/?token=${idToken}`);
  ws.onopen = () => log("WebSocket 已連線");
  ws.onmessage = (msg) => {
    log("收到訊息: " + msg.data);
  };
  ws.onerror = (err) => log("WebSocket 錯誤: " + err.message);
  ws.onclose = () => log("WebSocket 已關閉");
}

// ====== 指令封裝 ======
function sendCommand(action, payload) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log("WebSocket 尚未連線");
    return;
  }
  ws.send(JSON.stringify({ action, ...payload }));
}

// ====== 前端操作 ======
function updateNickname() {
  const nickname = prompt("輸入新的暱稱:");
  sendCommand("updateProjectData", {
    projectId: "gameA",
    payload: { nickname }
  });
}

function redeemInvite() {
  const code = prompt("輸入邀請碼:");
  sendCommand("redeemInvite", { code });
}

function earnCircuit() {
  const amount = parseInt(prompt("輸入發放 Circuit 數量:"));
  sendCommand("earnCircuit", {
    projectId: "gameA",
    amount,
    source: "manual_test"
  });
}
</script>

</body>
</html>

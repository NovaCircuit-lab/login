<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiaT27TRKaWCVQRkJ8VnwbnvvDRS9vINM",
  authDomain: "account-master-novacircuit.firebaseapp.com",
  projectId: "account-master-novacircuit",
  storageBucket: "account-master-novacircuit.firebasestorage.app",
  messagingSenderId: "539774822914",
  appId: "1:539774822914:web:531bee934e477fc319151b"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  window.login = async function () {
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;

      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        // 首次登入 → 建立初始資料
        await setDoc(userRef, {
          nickname: user.displayName || "未命名玩家",
          circuitCoin: 0,
          plan: "free",
          createdAt: new Date(),

          projects: {
            rustSurvival: {
              money: 0,
              items: [],
              guns: []
            },
            beacCrux: {
              money: 0,
              maps: [],
              territory: 0
            }
          }
        });

        alert("已建立 NovaCircuit 帳號！");
      } else {
        alert("歡迎回來！");
      }

    } catch (error) {
      console.error(error);
      alert("登入失敗");
    }
  };
</script>

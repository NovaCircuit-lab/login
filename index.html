<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Server 註冊測試頁</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #cfcfcf; }
input, button { margin: 5px 0; }
#log { border: 1px solid #555; height: 300px; overflow-y: scroll; padding: 5px; margin-top: 10px; }
</style>
</head>
<body>

<h2>Master Server 註冊/登入測試頁</h2>

<div>
  <h3>註冊帳號</h3>
  <input type="email" id="regEmail" placeholder="Email"><br>
  <input type="password" id="regPassword" placeholder="密碼"><br>
  <input type="text" id="nickname" placeholder="暱稱"><br>
  <input type="text" id="inviteCode" placeholder="邀請碼 (可選)"><br>
  <button onclick="register()">註冊</button>
</div>

<div>
  <h3>登入帳號</h3>
  <input type="email" id="loginEmail" placeholder="Email"><br>
  <input type="password" id="loginPassword" placeholder="密碼"><br>
  <button onclick="login()">登入</button>
</div>

<div>
  <h3>WebSocket 指令</h3>
  <button onclick="connectWS()">連線 WebSocket</button><br>
  <button onclick="updateNickname()">更新暱稱</button><br>
  <button onclick="redeemInvite()">兌換邀請碼</button><br>
  <button onclick="earnCircuit()">發放 Circuit 幣</button>
</div>

<div id="log"></div>

<script>
// ====== Firebase 初始化 ======
const firebaseConfig = {
  apiKey: "你的Firebase apiKey",
  authDomain: "account-master-novacircuit.firebaseapp.com",
  projectId: "account-master-novacircuit"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let ws = null;
let idToken = "";

// ====== 日誌 ======
function log(msg) {
  const logDiv = document.getElementById("log");
  logDiv.innerHTML += msg + "<br>";
  logDiv.scrollTop = logDiv.scrollHeight;
}

// ====== 註冊流程 ======
async function register() {
  const email = document.getElementById("regEmail").value;
  const password = document.getElementById("regPassword").value;
  const nickname = document.getElementById("nickname").value;
  const inviteCode = document.getElementById("inviteCode").value;

  try {
    // 1️⃣ Firebase 建立帳號
    const userCredential = await auth.createUserWithEmailAndPassword(email, password);

    // 2️⃣ 設定暱稱（Firebase displayName）
    await userCredential.user.updateProfile({ displayName: nickname });

    // 3️⃣ 發送 e-mail 驗證
    await userCredential.user.sendEmailVerification();
    log("註冊成功，驗證信已發送，請檢查 Email");

    // 4️⃣ 拿到 ID Token（暫時先登入）
    idToken = await userCredential.user.getIdToken();

    // 5️⃣ WebSocket 建立初始資料
    ws = new WebSocket(`wss://account-master.onrender.com/?token=${idToken}`);
    ws.onopen = async () => {
      log("WebSocket 已連線，建立初始資料");

      // 更新初始資料
      ws.send(JSON.stringify({
        action: "updateProjectData",
        projectId: "gameA",
        payload: {
          nickname,
          avatar: "",
          settings: {},
          level: 1,
          score: 0
        }
      }));

      // 若有邀請碼，立即兌換
      if (inviteCode) {
        ws.send(JSON.stringify({ action: "redeemInvite", code: inviteCode }));
      }
    };

    ws.onmessage = (msg) => log("收到訊息: " + msg.data);
    ws.onerror = (err) => log("WebSocket 錯誤: " + err.message);
    ws.onclose = () => log("WebSocket 已關閉");

  } catch (err) {
    log("註冊失敗: " + err.message);
  }
}

// ====== 登入 ======
async function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  try {
    const userCredential = await auth.signInWithEmailAndPassword(email, password);
    idToken = await userCredential.user.getIdToken();
    log(`登入成功: ${userCredential.user.uid}`);
  } catch (err) {
    log("登入失敗: " + err.message);
  }
}

// ====== WebSocket 連線 ======
function connectWS() {
  if (!idToken) { log("請先登入 Firebase"); return; }
  ws = new WebSocket(`wss://account-master.onrender.com/?token=${idToken}`);
  ws.onopen = () => log("WebSocket 已連線");
  ws.onmessage = (msg) => log("收到訊息: " + msg.data);
  ws.onerror = (err) => log("WebSocket 錯誤: " + err.message);
  ws.onclose = () => log("WebSocket 已關閉");
}

// ====== 指令封裝 ======
function sendCommand(action, payload) {
  if (!ws || ws.readyState !== WebSocket.OPEN) { log("WebSocket 尚未連線"); return; }
  ws.send(JSON.stringify({ action, ...payload }));
}

// ====== 前端操作 ======
function updateNickname() {
  const nickname = prompt("輸入新的暱稱:");
  sendCommand("updateProjectData", { projectId: "gameA", payload: { nickname } });
}

function redeemInvite() {
  const code = prompt("輸入邀請碼:");
  sendCommand("redeemInvite", { code });
}

function earnCircuit() {
  const amount = parseInt(prompt("輸入發放 Circuit 數量:"));
  sendCommand("earnCircuit", { projectId: "gameA", amount, source: "manual_test" });
}
</script>

</body>
</html>
